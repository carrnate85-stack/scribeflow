name: Validate owner update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: owner-update-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.head_ref, 'agent/')
    runs-on: windows-latest

    steps:
      - name: Check out proposed update without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release changes include a newer version
        shell: pwsh
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          $changedFiles = @(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD"
          )
          $releaseFiles = @(
            $changedFiles | Where-Object {
              $_ -match "^(app|assets|build|db|drizzle|github-pages|installer|public|scripts|worker)/" -or
              $_ -match "(^|/)(vite|next|postcss|tailwind|tsconfig)[^/]*\.(js|mjs|cjs|ts|json)$" -or
              $_ -in @(
                "package.json",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "Launch ScribeFlow.cmd"
              )
            }
          )
          if ($releaseFiles.Count -eq 0) {
            exit 0
          }

          $basePackageText = git show "origin/${{ github.base_ref }}:package.json"
          $baseVersion = [version](
            ($basePackageText -join "`n" | ConvertFrom-Json).version
          )
          $headVersion = [version](
            (Get-Content -LiteralPath "package.json" -Raw |
              ConvertFrom-Json).version
          )
          if ($headVersion -le $baseVersion) {
            throw "Release changes require package.json to be bumped above $baseVersion."
          }

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test desktop edition
        run: pnpm test

      - name: Test static web edition
        run: pnpm test:web

      - name: Reject high or critical production vulnerabilities
        run: pnpm audit:prod
