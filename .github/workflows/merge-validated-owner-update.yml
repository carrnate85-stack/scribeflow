name: Merge validated owner update

on:
  workflow_run:
    workflows:
      - Validate owner update
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-owner-update-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Merge the exact validated owner commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$EVENT_PATH")"
          validated_sha="$(jq -r '.workflow_run.head_sha' "$EVENT_PATH")"
          validated_branch="$(jq -r '.workflow_run.head_branch' "$EVENT_PATH")"
          validated_repo="$(jq -r '.workflow_run.head_repository.full_name // empty' "$EVENT_PATH")"

          if [[ -z "$pr_number" || -z "$validated_sha" ]]; then
            echo "No pull request was associated with the successful validation run."
            exit 1
          fi
          if [[ "$validated_repo" != "$REPOSITORY" || "$validated_branch" != agent/* ]]; then
            echo "Refusing to merge a branch outside the owner update boundary."
            exit 1
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          if [[ "$(jq -r '.state' <<<"$pr_json")" != "open" || \
                "$(jq -r '.user.login' <<<"$pr_json")" != "$REPOSITORY_OWNER" || \
                "$(jq -r '.head.repo.full_name' <<<"$pr_json")" != "$REPOSITORY" || \
                "$(jq -r '.head.sha' <<<"$pr_json")" != "$validated_sha" ]]; then
            echo "The pull request changed after validation or is not an owner update."
            exit 1
          fi

          changed_files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files" --jq '.[].filename')"
          if grep -q '^\.github/workflows/' <<<"$changed_files"; then
            echo "Workflow changes require an explicit, privileged review and are never auto-merged."
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<<"$pr_json")" == "true" ]]; then
            gh pr ready "$pr_number" --repo "$REPOSITORY"
          fi
          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$validated_sha"
